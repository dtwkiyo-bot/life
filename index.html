<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ライフマネージャー</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .hidden-view { display: none !important; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
    }
    input[type="date"] { position: relative; }
    .period-btn.active { background-color: #fbcfe8; color: #db2777; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-50 h-[100dvh] overflow-hidden text-gray-800 font-sans flex justify-center">

  <div class="w-full max-w-md bg-white shadow-xl h-full flex flex-col relative">
    
    <!-- メインコンテンツ -->
    <main class="flex-1 overflow-hidden relative">
      
      <!-- ================= ダイエット画面 ================= -->
      <div id="view-diet" class="h-full flex flex-col p-4 gap-3 overflow-y-auto">
        
        <!-- 入力モード -->
        <div id="diet-input-mode" class="flex-1 flex flex-col gap-3">
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex-1 flex flex-col justify-center">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-bold text-gray-700">記録する</h2>
              <input type="date" id="diet-date" class="text-sm border-none bg-gray-100 rounded-lg px-3 py-1.5 text-gray-700 outline-none">
            </div>
            <div class="flex gap-4">
              <div class="flex-1 space-y-1">
                <label class="text-[10px] text-gray-500 font-medium">体重 (kg)</label>
                <input type="number" step="0.1" id="diet-weight" class="w-full p-2.5 bg-gray-50 rounded-xl outline-none text-xl font-bold text-gray-800">
              </div>
              <div class="flex-1 space-y-1">
                <label class="text-[10px] text-gray-500 font-medium">目標 (kg)</label>
                <input type="number" step="0.1" id="diet-target" class="w-full p-2.5 bg-gray-50 rounded-xl outline-none text-xl font-bold text-gray-500">
              </div>
            </div>
            
            <div class="flex gap-2 mt-6">
              <button id="diet-delete-btn" class="hidden shrink-0 w-12 bg-red-50 text-red-500 hover:bg-red-100 rounded-xl flex items-center justify-center transition-colors">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
              </button>
              <button id="diet-save-btn" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm">
                <i data-lucide="plus" class="w-5 h-5" id="diet-save-icon"></i> <span id="diet-save-text">保存する</span>
              </button>
            </div>

            <div id="diet-diff-container" class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between hidden">
              <span class="text-sm text-gray-500">目標との差</span>
              <span id="diet-diff-value" class="font-bold text-xl"></span>
            </div>
          </div>
          
          <button id="diet-show-chart-btn" class="shrink-0 bg-white border-2 border-pink-100 text-pink-500 font-bold py-3.5 rounded-xl shadow-sm flex justify-center items-center gap-2">
            <i data-lucide="line-chart" class="w-5 h-5"></i> グラフを見る
          </button>
        </div>

        <!-- グラフモード -->
        <div id="diet-chart-mode" class="hidden flex-1 flex flex-col gap-3 min-h-0">
          <div class="flex justify-between items-center bg-gray-100 p-1.5 rounded-xl text-[10px] shrink-0">
            <button class="period-btn active flex-1 py-1.5 rounded-lg text-gray-600" data-period="7">7日</button>
            <button class="period-btn flex-1 py-1.5 rounded-lg text-gray-600" data-period="30">1ヶ月</button>
            <button class="period-btn flex-1 py-1.5 rounded-lg text-gray-600" data-period="90">3ヶ月</button>
            <button class="period-btn flex-1 py-1.5 rounded-lg text-gray-600" data-period="180">半年</button>
            <button class="period-btn flex-1 py-1.5 rounded-lg text-gray-600" data-period="365">1年</button>
            <button class="period-btn flex-1 py-1.5 rounded-lg text-gray-600" data-period="all">全て</button>
          </div>
          
          <div class="flex-1 bg-white rounded-2xl p-4 shadow-sm border border-gray-100 relative min-h-0">
            <canvas id="diet-chart"></canvas>
            <div id="diet-chart-empty" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm bg-white rounded-2xl hidden">データがありません</div>
          </div>
          
          <button id="diet-hide-chart-btn" class="shrink-0 bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-sm flex justify-center items-center gap-2">
            <i data-lucide="edit-3" class="w-5 h-5"></i> 入力に戻る
          </button>
        </div>
      </div>

      <!-- ================= 目標設定画面 ================= -->
      <div id="view-target" class="hidden-view h-full flex flex-col p-4 gap-3 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex-1 flex flex-col">
          <h2 class="font-bold text-gray-800 mb-2 flex items-center gap-2 shrink-0">
            <i data-lucide="settings" class="text-purple-500 w-5 h-5"></i> 目標の自動計算セット
          </h2>
          <p class="text-[11px] text-gray-500 mb-4 leading-relaxed shrink-0">
            日々の目標体重を自動計算して、指定した期間に一括で割り当てます。
          </p>

          <!-- 計算方法の切り替えタブ -->
          <div class="flex bg-gray-100 p-1 rounded-xl mb-4 shrink-0">
            <button id="tab-calc-period" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-purple-600 transition-all">期間から設定</button>
            <button id="tab-calc-pace" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all">ペースから設定</button>
          </div>

          <!-- スクロール領域を削除し、flex-1で高さを吸収しつつ要素を詰める -->
          <div class="flex-1 flex flex-col min-h-0 space-y-4">
            
            <!-- ====== モード1: 期間から設定 ====== -->
            <div id="mode-calc-period" class="flex-1 flex flex-col gap-3">
              <div class="bg-purple-50/50 p-2.5 rounded-xl border border-purple-100">
                <label class="text-[10px] font-bold text-purple-700 block mb-1">いつまでに？ (期間)</label>
                <div class="flex gap-2 items-center">
                  <input type="date" id="target-start-date" class="flex-1 text-xs p-1.5 rounded-lg border border-purple-200 outline-none focus:ring-2 focus:ring-purple-300">
                  <span class="text-purple-400">〜</span>
                  <input type="date" id="target-end-date" class="flex-1 text-xs p-1.5 rounded-lg border border-purple-200 outline-none focus:ring-2 focus:ring-purple-300">
                </div>
              </div>

              <div class="bg-purple-50/50 p-2.5 rounded-xl border border-purple-100">
                <label class="text-[10px] font-bold text-purple-700 block mb-1">どうなりたい？ (目標体重)</label>
                <div class="flex gap-4">
                  <div class="flex-1">
                    <label class="text-[10px] text-purple-500 block mb-0.5">開始時 (kg)</label>
                    <input type="number" step="0.1" id="target-start-weight" class="w-full p-1.5 text-sm font-bold rounded-lg border border-purple-200 outline-none focus:ring-2 focus:ring-purple-300">
                  </div>
                  <div class="flex-1">
                    <label class="text-[10px] text-purple-500 block mb-0.5">終了時 (kg)</label>
                    <input type="number" step="0.1" id="target-end-weight" class="w-full p-1.5 text-sm font-bold rounded-lg border border-purple-200 outline-none focus:ring-2 focus:ring-purple-300">
                  </div>
                </div>
              </div>
            </div>

            <!-- ====== モード2: ペースから設定 ====== -->
            <div id="mode-calc-pace" class="flex-1 flex flex-col gap-3 hidden">
              
              <div class="bg-blue-50/50 p-2.5 rounded-xl border border-blue-100 flex gap-2">
                <div class="flex-1">
                  <label class="text-[10px] font-bold text-blue-700 block mb-0.5">今の体重(kg)</label>
                  <input type="number" step="0.1" id="pace-start-weight" class="w-full p-1.5 text-sm font-bold rounded-lg border border-blue-200 outline-none focus:ring-2 focus:ring-blue-300">
                </div>
                <div class="flex-1">
                  <label class="text-[10px] font-bold text-blue-700 block mb-0.5">最終目標(kg)</label>
                  <input type="number" step="0.1" id="pace-end-weight" class="w-full p-1.5 text-sm font-bold rounded-lg border border-blue-200 outline-none focus:ring-2 focus:ring-blue-300">
                </div>
              </div>

              <div class="bg-blue-50/50 p-2.5 rounded-xl border border-blue-100">
                <label class="text-[10px] font-bold text-blue-700 block mb-1">どのくらいのペースで？</label>
                <div class="flex items-center gap-2 justify-center">
                  <input type="number" id="pace-days" value="2" min="1" class="w-12 p-1.5 text-sm text-center font-bold rounded-lg border border-blue-200 outline-none focus:ring-2 focus:ring-blue-300">
                  <span class="text-xs font-bold text-blue-600">日で</span>
                  <input type="number" id="pace-grams" value="100" min="10" step="10" class="w-16 p-1.5 text-sm text-center font-bold rounded-lg border border-blue-200 outline-none focus:ring-2 focus:ring-blue-300">
                  <span class="text-xs font-bold text-blue-600">g 減</span>
                </div>
              </div>
              
              <!-- 達成予定日プレビュー -->
              <div class="bg-gray-50 p-2 rounded-xl border border-gray-200 text-center flex items-center justify-between px-4">
                <span class="text-[10px] font-bold text-gray-500">達成予定日</span>
                <div class="text-right">
                  <p id="pace-result-date" class="text-sm font-bold text-blue-600 leading-none">---</p>
                  <p id="pace-result-days" class="text-[9px] text-gray-500 mt-0.5 leading-none"></p>
                </div>
                <input type="hidden" id="pace-calculated-end-date">
              </div>
            </div>

            <button id="target-save-btn" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 rounded-xl shadow-sm transition-colors mt-auto shrink-0">
              自動計算して設定
            </button>
          </div>

          <!-- 一括削除エリア (横に詰めて配置) -->
          <div class="mt-4 pt-3 border-t border-gray-100 shrink-0">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-gray-400">データ一括リセット</span>
              <div class="flex gap-1.5">
                <button onclick="bulkDelete('weights', '体重')" class="px-3 py-1.5 bg-red-50 text-red-500 text-[10px] font-bold rounded-lg hover:bg-red-100">体重</button>
                <button onclick="bulkDelete('expenses', '支出')" class="px-3 py-1.5 bg-red-50 text-red-500 text-[10px] font-bold rounded-lg hover:bg-red-100">支出</button>
                <button onclick="bulkDelete('works', '副業')" class="px-3 py-1.5 bg-red-50 text-red-500 text-[10px] font-bold rounded-lg hover:bg-red-100">副業</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 支出管理画面 ================= -->
      <div id="view-expense" class="hidden-view h-full flex flex-col p-4 gap-3 overflow-y-auto">
        <div class="flex justify-end shrink-0">
          <button id="exp-history-btn" class="text-xs font-bold text-blue-500 flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-full"><i data-lucide="list" class="w-3.5 h-3.5"></i> 履歴を見る</button>
        </div>
        
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-gray-700 text-sm">支出を記録</h2>
            <input type="date" id="expense-date" class="text-xs border-none bg-gray-100 rounded-lg px-2 py-1 outline-none">
          </div>
          <div id="expense-categories" class="flex flex-wrap gap-1.5 mb-3"></div>
          <div class="relative mb-3">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">¥</span>
            <input type="number" id="expense-amount" placeholder="0" class="w-full pl-8 p-2.5 bg-gray-50 rounded-xl outline-none font-bold text-lg">
          </div>
          <input type="hidden" id="expense-edit-id">
          <button id="expense-save-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-1 shadow-sm">
            <i data-lucide="plus" class="w-4 h-4" id="expense-save-icon"></i> <span id="expense-save-text">追加</span>
          </button>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex-1 flex flex-col min-h-[220px]">
          <div class="text-center mb-2 shrink-0">
            <p class="text-xs text-gray-500">今月の総支出</p>
            <p id="exp-total-amount" class="text-2xl font-bold text-gray-800">¥0</p>
          </div>
          <div class="flex-1 relative w-full h-full min-h-0">
            <canvas id="expense-chart"></canvas>
            <div id="expense-chart-empty" class="absolute inset-0 flex items-center justify-center text-gray-400 text-xs bg-white">記録なし</div>
          </div>
        </div>
      </div>

      <!-- ================= 副業記録画面 ================= -->
      <div id="view-work" class="hidden-view h-full flex flex-col p-4 gap-3 overflow-y-auto">
        <div class="flex justify-end shrink-0">
          <button id="work-history-btn" class="text-xs font-bold text-orange-500 flex items-center gap-1 bg-orange-50 px-3 py-1.5 rounded-full"><i data-lucide="list" class="w-3.5 h-3.5"></i> 履歴を見る</button>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-gray-700 text-sm">今日の副業タイム</h2>
            <input type="date" id="work-date" class="text-xs border-none bg-gray-100 rounded-lg px-2 py-1 outline-none">
          </div>
          <label class="text-[10px] text-gray-500 font-medium block mb-1">作業時間 (分) / 目標: 30分</label>
          <div class="relative mb-3">
            <input type="number" id="work-minutes" placeholder="例: 30" class="w-full p-2.5 bg-gray-50 rounded-xl outline-none font-bold text-lg">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 font-medium text-sm">分</span>
          </div>
          <button id="work-save-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-1 shadow-sm">
            <i data-lucide="plus" class="w-4 h-4" id="work-save-icon"></i> <span id="work-save-text">記録</span>
          </button>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex-1 flex flex-col min-h-[220px]">
          <h2 class="font-bold text-gray-700 mb-2 flex items-center gap-1 text-sm shrink-0">
            <i data-lucide="target" class="text-orange-500 w-4 h-4"></i> 推移
          </h2>
          <div class="flex-1 relative w-full h-full min-h-0">
            <canvas id="work-chart"></canvas>
            <div id="work-chart-empty" class="absolute inset-0 flex items-center justify-center text-gray-400 text-xs bg-white">データなし</div>
          </div>
        </div>
      </div>

    </main>

    <!-- ボトムナビゲーション -->
    <nav class="shrink-0 w-full bg-white border-t border-gray-200 flex justify-around pb-safe relative z-10">
      <button data-tab="diet" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-pink-500 font-bold">
        <i data-lucide="activity" class="w-5 h-5"></i><span class="text-[10px]">体重</span>
      </button>
      <button data-tab="target" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="target" class="w-5 h-5"></i><span class="text-[10px]">目標設定</span>
      </button>
      <button data-tab="expense" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="dollar-sign" class="w-5 h-5"></i><span class="text-[10px]">支出</span>
      </button>
      <button data-tab="work" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="laptop" class="w-5 h-5"></i><span class="text-[10px]">副業</span>
      </button>
    </nav>
  </div>

  <!-- 履歴表示モーダル (月別) -->
  <div id="history-modal" class="fixed inset-0 bg-black/60 z-40 hidden flex-col justify-end transition-opacity duration-300 opacity-0">
    <div id="history-modal-content" class="bg-white w-full max-w-md mx-auto rounded-t-2xl h-[75dvh] flex flex-col transform translate-y-full transition-transform duration-300">
      <div class="flex justify-between items-center p-4 border-b shrink-0">
        <h3 id="history-title" class="font-bold text-gray-800">履歴</h3>
        <button id="history-close-btn" class="text-gray-500 p-1 bg-gray-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex justify-between items-center p-3 bg-gray-50 border-b shrink-0">
        <button id="hist-prev-month" class="p-1 text-gray-600 hover:bg-gray-200 rounded"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <span id="hist-month-title" class="font-bold text-sm text-gray-700"></span>
        <button id="hist-next-month" class="p-1 text-gray-600 hover:bg-gray-200 rounded"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50">
        <!-- JSでリスト生成 -->
      </div>
    </div>
  </div>

  <!-- カスタム確認ダイアログ (削除確認用) -->
  <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-6 w-11/12 max-w-xs shadow-xl transform scale-95 transition-transform duration-200" id="confirm-box">
      <p id="confirm-message" class="text-gray-800 font-bold mb-6 text-center text-sm leading-relaxed"></p>
      <div class="flex gap-3">
        <button id="confirm-cancel" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm">キャンセル</button>
        <button id="confirm-ok" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-sm shadow-sm">削除する</button>
      </div>
    </div>
  </div>

  <script>
    // --- ユーティリティ関数 ---
    const getToday = () => new Date();
    const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const getOffsetDateStr = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return formatDate(d); };
    const getTodayStr = () => formatDate(getToday());

    // --- 確認ダイアログ ---
    let confirmCallback = null;
    const showConfirm = (msg, callback) => {
      document.getElementById('confirm-message').textContent = msg;
      confirmCallback = callback;
      const modal = document.getElementById('confirm-modal');
      const box = document.getElementById('confirm-box');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      box.classList.remove('scale-95');
    };
    const hideConfirm = () => {
      const modal = document.getElementById('confirm-modal');
      const box = document.getElementById('confirm-box');
      modal.classList.add('opacity-0', 'pointer-events-none');
      box.classList.add('scale-95');
      confirmCallback = null;
    };
    
    // イベントリスナーの安全な登録
    const safeAddListener = (id, event, handler) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    };

    safeAddListener('confirm-cancel', 'click', hideConfirm);
    safeAddListener('confirm-ok', 'click', () => {
      if(confirmCallback) confirmCallback();
      hideConfirm();
    });

    // 一括削除
    window.bulkDelete = (key, name) => {
      showConfirm(`${name}のデータを全てリセットしますか？`, () => {
        state[key] = [];
        saveData(key, []);
        switchTab(state.activeTab); // 現在のタブを再描画
      });
    };

    // --- 定数と状態 ---
    const EXPENSE_CATEGORIES = ['食費', '日用品', '嗜好品', '趣味', 'その他'];
    const CATEGORY_COLORS = { '食費':'#f87171', '日用品':'#60a5fa', '嗜好品':'#fbbf24', '趣味':'#34d399', 'その他':'#a78bfa' };
    const WORK_GOAL = 30;

    const defaultData = {
      weights: [],
      expenses: [],
      works: []
    };

    const loadData = (key) => {
      const saved = localStorage.getItem('lifeManager_' + key);
      return saved ? JSON.parse(saved) : defaultData[key];
    };
    const saveData = (key, data) => { localStorage.setItem('lifeManager_' + key, JSON.stringify(data)); };

    let state = {
      activeTab: 'diet',
      weights: loadData('weights'),
      expenses: loadData('expenses'),
      works: loadData('works'),
      expenseMonth: { year: getToday().getFullYear(), month: getToday().getMonth() + 1 },
      expenseCategory: EXPENSE_CATEGORIES[0],
      dietChartPeriod: 7, 
      histType: null, 
      histMonth: { year: getToday().getFullYear(), month: getToday().getMonth() + 1 }
    };

    let dietChart = null, expenseChart = null, workChart = null;

    // --- タブ切り替え ---
    const switchTab = (tabId) => {
      state.activeTab = tabId;
      document.querySelectorAll('.hidden-view, [id^="view-"]').forEach(el => {
        if(el.id.startsWith('view-')) el.classList.add('hidden-view');
      });
      const targetView = document.getElementById(`view-${tabId}`);
      if(targetView) targetView.classList.remove('hidden-view');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = "nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-400";
      });
      const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
      
      if(activeBtn) {
        const colorClass = tabId === 'diet' ? 'text-pink-500' : tabId === 'target' ? 'text-purple-500' : tabId === 'expense' ? 'text-blue-500' : 'text-orange-500';
        activeBtn.classList.replace('text-gray-400', colorClass);
        activeBtn.classList.add('font-bold');
      }
      
      if(tabId === 'diet') renderDietInput();
      else if(tabId === 'target') renderTarget();
      else if(tabId === 'expense') renderExpense();
      else if(tabId === 'work') renderWork();
      
      lucide.createIcons();
    };

    // ================= ダイエット画面 =================
    const dietDateEl = document.getElementById('diet-date');
    const dietWeightEl = document.getElementById('diet-weight');
    const dietTargetEl = document.getElementById('diet-target');
    const dietDelBtn = document.getElementById('diet-delete-btn');
    const dietSaveBtn = document.getElementById('diet-save-btn');
    const dietSaveIcon = document.getElementById('diet-save-icon');
    const dietSaveText = document.getElementById('diet-save-text');

    safeAddListener('diet-date', 'change', () => { updateDietForm(); });
    
    const updateDietForm = () => {
      if(!dietDateEl) return;
      const date = dietDateEl.value || getTodayStr();
      dietDateEl.value = date;
      const record = state.weights.find(r => r.date === date);
      
      if (record) {
        if(dietWeightEl) dietWeightEl.value = record.weight !== null ? record.weight : '';
        if(dietTargetEl) dietTargetEl.value = record.target !== null ? record.target : '';
        if (record.weight !== null || record.target !== null) {
          if(dietDelBtn) dietDelBtn.classList.remove('hidden');
          if(dietSaveText) dietSaveText.textContent = "更新する";
          if(dietSaveIcon) dietSaveIcon.setAttribute('data-lucide', 'refresh-cw');
        } else {
          if(dietDelBtn) dietDelBtn.classList.add('hidden');
          if(dietSaveText) dietSaveText.textContent = "保存する";
          if(dietSaveIcon) dietSaveIcon.setAttribute('data-lucide', 'plus');
        }
      } else {
        if(dietWeightEl) dietWeightEl.value = '';
        if(dietTargetEl) dietTargetEl.value = '';
        if(dietDelBtn) dietDelBtn.classList.add('hidden');
        if(dietSaveText) dietSaveText.textContent = "保存する";
        if(dietSaveIcon) dietSaveIcon.setAttribute('data-lucide', 'plus');
      }
      lucide.createIcons();
      
      // 差分表示更新（クリア！！演出）
      const diffEl = document.getElementById('diet-diff-container');
      const diffValEl = document.getElementById('diet-diff-value');
      
      if(record && record.weight && record.target && diffEl && diffValEl) {
        const diff = (record.weight - record.target).toFixed(1);
        if (diff <= 0) {
          diffValEl.textContent = 'クリア！！';
          diffValEl.className = 'font-bold text-xl text-pink-500';
        } else {
          diffValEl.textContent = `+${diff} kg`;
          diffValEl.className = 'font-bold text-xl text-gray-800';
        }
        diffEl.classList.remove('hidden');
      } else if (diffEl) {
        diffEl.classList.add('hidden');
      }
    };

    safeAddListener('diet-save-btn', 'click', () => {
      if(!dietDateEl) return;
      const date = dietDateEl.value;
      const w = dietWeightEl.value ? parseFloat(dietWeightEl.value) : null;
      const t = dietTargetEl.value ? parseFloat(dietTargetEl.value) : null;
      if (w === null && t === null) return;

      const idx = state.weights.findIndex(r => r.date === date);
      if (idx >= 0) state.weights[idx] = { date, weight: w, target: t };
      else state.weights.push({ date, weight: w, target: t });
      
      state.weights.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveData('weights', state.weights);
      updateDietForm();
    });

    safeAddListener('diet-delete-btn', 'click', () => {
      if(!dietDateEl) return;
      showConfirm(`${dietDateEl.value} の記録を削除しますか？`, () => {
        state.weights = state.weights.filter(r => r.date !== dietDateEl.value);
        saveData('weights', state.weights);
        updateDietForm();
      });
    });

    const renderDietInput = () => {
      const modeIn = document.getElementById('diet-input-mode');
      const modeCh = document.getElementById('diet-chart-mode');
      if(modeIn) modeIn.classList.remove('hidden');
      if(modeCh) modeCh.classList.add('hidden');
      if (dietDateEl && !dietDateEl.value) dietDateEl.value = getTodayStr();
      updateDietForm();
    };

    safeAddListener('diet-show-chart-btn', 'click', () => {
      const modeIn = document.getElementById('diet-input-mode');
      const modeCh = document.getElementById('diet-chart-mode');
      if(modeIn) modeIn.classList.add('hidden');
      if(modeCh) modeCh.classList.remove('hidden');
      renderDietChart();
    });
    safeAddListener('diet-hide-chart-btn', 'click', renderDietInput);

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.dietChartPeriod = e.target.dataset.period === 'all' ? 'all' : parseInt(e.target.dataset.period);
        renderDietChart();
      });
    });

    const renderDietChart = () => {
      const canvas = document.getElementById('diet-chart');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const emptyEl = document.getElementById('diet-chart-empty');
      
      const todayStr = getTodayStr();
      let targetData = state.weights.filter(r => r.date <= todayStr);
      
      if (state.dietChartPeriod !== 'all') {
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - state.dietChartPeriod + 1);
        const startStr = formatDate(startDate);
        targetData = targetData.filter(r => r.date >= startStr);
      }
      
      if (targetData.length === 0) {
        if(emptyEl) emptyEl.classList.remove('hidden');
        if (dietChart) dietChart.destroy();
        return;
      }
      if(emptyEl) emptyEl.classList.add('hidden');

      const labels = targetData.map(r => r.date.substring(5).replace('-', '/'));
      const wData = targetData.map(r => r.weight);
      const tData = targetData.map(r => r.target);
      
      const allVals = [...wData, ...tData].filter(v => v !== null);
      const min = Math.floor(Math.min(...allVals) * 2) / 2 - 0.5;
      const max = Math.ceil(Math.max(...allVals) * 2) / 2 + 0.5;

      if (dietChart) dietChart.destroy();
      dietChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [
          { label: '実体重', data: wData, borderColor: '#ec4899', backgroundColor: '#fff', borderWidth: 3, pointRadius: 4, spanGaps: false },
          { label: '目標', data: tData, borderColor: '#3b82f6', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, spanGaps: true }
        ]},
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, font: {size: 10} } } },
          scales: { x: { grid: { display: false }, ticks:{font:{size:9}} }, y: { min, max, ticks: { stepSize: 0.5, font:{size:9} }, border: { display: false } } }
        }
      });
    };

    // ================= 目標設定画面 =================
    const tStartEl = document.getElementById('target-start-date');
    const tEndEl = document.getElementById('target-end-date');
    const tStartWEl = document.getElementById('target-start-weight');
    const tEndWEl = document.getElementById('target-end-weight');
    
    // ペース設定用要素
    const tabCalcPeriod = document.getElementById('tab-calc-period');
    const tabCalcPace = document.getElementById('tab-calc-pace');
    const modeCalcPeriod = document.getElementById('mode-calc-period');
    const modeCalcPace = document.getElementById('mode-calc-pace');
    
    const paceStartWEl = document.getElementById('pace-start-weight');
    const paceEndWEl = document.getElementById('pace-end-weight');
    const paceDaysEl = document.getElementById('pace-days');
    const paceGramsEl = document.getElementById('pace-grams');
    const paceResultDateEl = document.getElementById('pace-result-date');
    const paceResultDaysEl = document.getElementById('pace-result-days');
    const paceCalcEndDateEl = document.getElementById('pace-calculated-end-date');
    const targetSaveBtn = document.getElementById('target-save-btn');

    let currentCalcMode = 'period'; 

    if (tabCalcPeriod && tabCalcPace) {
      tabCalcPeriod.addEventListener('click', () => {
        currentCalcMode = 'period';
        tabCalcPeriod.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-purple-600 transition-all";
        tabCalcPace.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all";
        modeCalcPeriod.classList.remove('hidden');
        modeCalcPace.classList.add('hidden');
        targetSaveBtn.className = "w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3.5 rounded-xl mt-2 shadow-sm transition-colors";
      });

      tabCalcPace.addEventListener('click', () => {
        currentCalcMode = 'pace';
        tabCalcPace.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600 transition-all";
        tabCalcPeriod.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all";
        modeCalcPace.classList.remove('hidden');
        modeCalcPeriod.classList.add('hidden');
        targetSaveBtn.className = "w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl mt-2 shadow-sm transition-colors";
        calculatePaceResult();
      });
    }

    const calculatePaceResult = () => {
      if (!paceStartWEl) return;
      const sWeight = parseFloat(paceStartWEl.value);
      const eWeight = parseFloat(paceEndWEl.value);
      const days = parseInt(paceDaysEl.value, 10);
      const grams = parseInt(paceGramsEl.value, 10);

      if (isNaN(sWeight) || isNaN(eWeight) || isNaN(days) || isNaN(grams) || sWeight <= eWeight || days <= 0 || grams <= 0) {
        if(paceResultDateEl) paceResultDateEl.textContent = "---";
        if(paceResultDaysEl) paceResultDaysEl.textContent = "正しい数値を入力してください";
        if(paceCalcEndDateEl) paceCalcEndDateEl.value = "";
        return;
      }

      const diffGrams = (sWeight - eWeight) * 1000;
      const gramsPerDay = grams / days;
      const requiredDays = Math.ceil(diffGrams / gramsPerDay);

      const startDate = getToday();
      const endDate = new Date(startDate);
      endDate.setDate(startDate.getDate() + requiredDays);

      if(paceResultDateEl) paceResultDateEl.textContent = `${endDate.getFullYear()}年${endDate.getMonth() + 1}月${endDate.getDate()}日`;
      if(paceResultDaysEl) paceResultDaysEl.textContent = `今日から ${requiredDays} 日後`;
      if(paceCalcEndDateEl) paceCalcEndDateEl.value = formatDate(endDate);
    };

    if (paceStartWEl) paceStartWEl.addEventListener('input', calculatePaceResult);
    if (paceEndWEl) paceEndWEl.addEventListener('input', calculatePaceResult);
    if (paceDaysEl) paceDaysEl.addEventListener('input', calculatePaceResult);
    if (paceGramsEl) paceGramsEl.addEventListener('input', calculatePaceResult);

    const renderTarget = () => {
      if(tStartEl && !tStartEl.value) {
        tStartEl.value = getTodayStr();
        if(tEndEl) tEndEl.value = getOffsetDateStr(30);
      }
      const todayRec = state.weights.find(r => r.date === getTodayStr());
      const defaultWeight = todayRec?.weight || todayRec?.target || '';
      
      if(tStartWEl && !tStartWEl.value) tStartWEl.value = defaultWeight;
      if(paceStartWEl && !paceStartWEl.value) paceStartWEl.value = defaultWeight;
      
      calculatePaceResult();
    };

    if (targetSaveBtn) {
      targetSaveBtn.addEventListener('click', () => {
        let startDateStr, endDateStr, sWeight, eWeight;

        if (currentCalcMode === 'period') {
          startDateStr = tStartEl ? tStartEl.value : null;
          endDateStr = tEndEl ? tEndEl.value : null;
          sWeight = tStartWEl ? parseFloat(tStartWEl.value) : NaN;
          eWeight = tEndWEl ? parseFloat(tEndWEl.value) : NaN;
        } else {
          startDateStr = getTodayStr();
          endDateStr = paceCalcEndDateEl ? paceCalcEndDateEl.value : null;
          sWeight = paceStartWEl ? parseFloat(paceStartWEl.value) : NaN;
          eWeight = paceEndWEl ? parseFloat(paceEndWEl.value) : NaN;
        }

        if (!startDateStr || !endDateStr || isNaN(sWeight) || isNaN(eWeight)) return;

        const start = new Date(startDateStr);
        const end = new Date(endDateStr);
        const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
        
        if (diffDays <= 0) {
          alert('終了日は開始日より後の日付にしてください。');
          return;
        }

        const diffPerDay = (eWeight - sWeight) / diffDays;

        for (let i = 0; i <= diffDays; i++) {
          const d = new Date(start); d.setDate(start.getDate() + i);
          const dateStr = formatDate(d);
          const targetW = Math.round((sWeight + (diffPerDay * i)) * 10) / 10;
          
          const idx = state.weights.findIndex(r => r.date === dateStr);
          if (idx >= 0) state.weights[idx].target = targetW;
          else state.weights.push({ date: dateStr, weight: null, target: targetW });
        }
        
        state.weights.sort((a, b) => new Date(a.date) - new Date(b.date));
        saveData('weights', state.weights);
        
        showConfirm("目標を一括設定しました。記録画面に戻りますか？", () => switchTab('diet'));
        const btnCancel = document.getElementById('confirm-cancel');
        const btnOk = document.getElementById('confirm-ok');
        if(btnCancel) btnCancel.textContent = "閉じる"; 
        if(btnOk) btnOk.textContent = "戻る";
      });
    }

    // ================= 支出管理画面 =================
    const expDateEl = document.getElementById('expense-date');
    const expAmountEl = document.getElementById('expense-amount');
    const expCatContainer = document.getElementById('expense-categories');
    const expEditIdEl = document.getElementById('expense-edit-id');
    const expSaveBtn = document.getElementById('expense-save-btn');
    const expSaveIcon = document.getElementById('expense-save-icon');
    const expSaveText = document.getElementById('expense-save-text');
    
    const resetExpenseForm = () => {
      if(expDateEl) expDateEl.value = getTodayStr();
      if(expAmountEl) expAmountEl.value = '';
      if(expEditIdEl) expEditIdEl.value = '';
      if(expSaveText) expSaveText.textContent = "追加";
      if(expSaveIcon) expSaveIcon.setAttribute('data-lucide', 'plus');
      lucide.createIcons();
    };

    const renderExpCategories = () => {
      if(!expCatContainer) return;
      expCatContainer.innerHTML = EXPENSE_CATEGORIES.map(cat => `
        <button data-cat="${cat}" class="exp-cat-btn px-2 py-1 rounded-full text-[10px] font-bold transition-colors ${state.expenseCategory === cat ? 'bg-blue-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}">
          ${cat}
        </button>
      `).join('');
      document.querySelectorAll('.exp-cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.expenseCategory = e.target.dataset.cat;
          renderExpCategories();
        });
      });
    };

    safeAddListener('expense-save-btn', 'click', () => {
      if(!expAmountEl) return;
      const amount = parseInt(expAmountEl.value, 10);
      if(!amount || isNaN(amount)) return;
      
      const editId = expEditIdEl ? expEditIdEl.value : null;
      if (editId) {
        const idx = state.expenses.findIndex(e => e.id == editId);
        if(idx >= 0) {
          state.expenses[idx] = { ...state.expenses[idx], date: expDateEl.value, amount, category: state.expenseCategory };
        }
      } else {
        state.expenses.push({ id: Date.now(), date: expDateEl.value, amount, category: state.expenseCategory });
      }
      
      state.expenses.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveData('expenses', state.expenses);
      resetExpenseForm();
      renderExpense();
    });

    const renderExpense = () => {
      if(expDateEl && !expDateEl.value) resetExpenseForm();
      renderExpCategories();
      const mStr = `${state.expenseMonth.year}-${String(state.expenseMonth.month).padStart(2, '0')}`;
      const mExpenses = state.expenses.filter(e => e.date.startsWith(mStr));
      
      const totalEl = document.getElementById('exp-total-amount');
      if(totalEl) totalEl.textContent = `¥${mExpenses.reduce((s, e) => s + e.amount, 0).toLocaleString()}`;
      
      const agg = {}; mExpenses.forEach(e => { agg[e.category] = (agg[e.category] || 0) + e.amount; });
      const chartData = Object.keys(agg).map(k => ({ name: k, value: agg[k] })).sort((a,b) => b.value - a.value);

      const canvas = document.getElementById('expense-chart');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const emptyEl = document.getElementById('expense-chart-empty');
      if (chartData.length === 0) { if(emptyEl) emptyEl.classList.remove('hidden'); if(expenseChart) expenseChart.destroy(); return; }
      if(emptyEl) emptyEl.classList.add('hidden');

      if (expenseChart) expenseChart.destroy();
      expenseChart = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: chartData.map(d => d.name), datasets: [{ data: chartData.map(d => d.value), backgroundColor: chartData.map(d => CATEGORY_COLORS[d.name]), borderWidth: 1 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right', labels: { boxWidth: 10, font:{size:10} } } } }
      });
    };

    // ================= 副業記録画面 =================
    const workDateEl = document.getElementById('work-date');
    const workMinEl = document.getElementById('work-minutes');
    const workSaveBtn = document.getElementById('work-save-btn');
    const workSaveIcon = document.getElementById('work-save-icon');
    const workSaveText = document.getElementById('work-save-text');

    safeAddListener('work-date', 'change', () => { updateWorkForm(); });
    
    const updateWorkForm = () => {
      if(!workDateEl) return;
      const date = workDateEl.value || getTodayStr();
      workDateEl.value = date;
      const record = state.works.find(r => r.date === date);
      if(workMinEl) workMinEl.value = record ? record.minutes : '';
      
      if(record) {
        if(workSaveText) workSaveText.textContent = "更新する";
        if(workSaveIcon) workSaveIcon.setAttribute('data-lucide', 'refresh-cw');
      } else {
        if(workSaveText) workSaveText.textContent = "記録する";
        if(workSaveIcon) workSaveIcon.setAttribute('data-lucide', 'plus');
      }
      lucide.createIcons();
    };

    safeAddListener('work-save-btn', 'click', () => {
      if(!workMinEl || !workDateEl) return;
      const mins = parseInt(workMinEl.value, 10);
      if(!mins || isNaN(mins)) return;
      const date = workDateEl.value;
      const idx = state.works.findIndex(r => r.date === date);
      if (idx >= 0) state.works[idx].minutes = mins; else state.works.push({ date, minutes: mins });
      state.works.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveData('works', state.works);
      updateWorkForm();
      renderWork();
    });

    const renderWork = () => {
      if(workDateEl && !workDateEl.value) workDateEl.value = getTodayStr();
      updateWorkForm();
      
      const canvas = document.getElementById('work-chart');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const emptyEl = document.getElementById('work-chart-empty');
      const recentWorks = state.works.slice(-14);
      if (recentWorks.length === 0) { if(emptyEl) emptyEl.classList.remove('hidden'); if(workChart) workChart.destroy(); return; }
      if(emptyEl) emptyEl.classList.add('hidden');

      const labels = recentWorks.map(r => r.date.substring(5).replace('-', '/'));
      const data = recentWorks.map(r => r.minutes);
      const bgColors = data.map(m => m >= WORK_GOAL ? '#f97316' : '#fdba74');
      
      if (workChart) workChart.destroy();
      workChart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [
          { type: 'line', data: Array(recentWorks.length).fill(WORK_GOAL), borderColor: '#f97316', borderWidth: 1, borderDash: [3, 3], pointRadius: 0, fill: false },
          { type: 'bar', data, backgroundColor: bgColors, borderRadius: 2 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks:{font:{size:9}} }, y: { beginAtZero: true, border: { display: false }, ticks:{font:{size:9}} } } }
      });
    };

    // ================= 履歴モーダル処理 (支出＆副業) =================
    const histModal = document.getElementById('history-modal');
    const histModalContent = document.getElementById('history-modal-content');
    
    const openHistory = (type) => {
      state.histType = type;
      state.histMonth = { year: getToday().getFullYear(), month: getToday().getMonth() + 1 };
      const titleEl = document.getElementById('history-title');
      if(titleEl) titleEl.textContent = type === 'expense' ? '支出履歴' : '副業履歴';
      
      if(histModal) histModal.classList.remove('hidden');
      setTimeout(() => {
        if(histModal) histModal.classList.remove('opacity-0');
        if(histModalContent) histModalContent.classList.remove('translate-y-full');
      }, 10);
      renderHistoryList();
    };

    const closeHistory = () => {
      if(histModal) histModal.classList.add('opacity-0');
      if(histModalContent) histModalContent.classList.add('translate-y-full');
      setTimeout(() => {
         if(histModal) histModal.classList.add('hidden');
      }, 300);
    };

    safeAddListener('exp-history-btn', 'click', () => openHistory('expense'));
    safeAddListener('work-history-btn', 'click', () => openHistory('work'));
    safeAddListener('history-close-btn', 'click', closeHistory);

    const changeHistMonth = (offset) => {
      let m = state.histMonth.month + offset;
      let y = state.histMonth.year;
      if(m > 12) { m = 1; y++; } else if(m < 1) { m = 12; y--; }
      state.histMonth = { year: y, month: m };
      renderHistoryList();
    };
    safeAddListener('hist-prev-month', 'click', () => changeHistMonth(-1));
    safeAddListener('hist-next-month', 'click', () => changeHistMonth(1));

    // 履歴アイテムの編集
    window.editHistItem = (idOrDate) => {
      closeHistory();
      if(state.histType === 'expense') {
        const item = state.expenses.find(e => e.id == idOrDate);
        if(item) {
          if(expDateEl) expDateEl.value = item.date;
          if(expAmountEl) expAmountEl.value = item.amount;
          state.expenseCategory = item.category;
          if(expEditIdEl) expEditIdEl.value = item.id;
          if(expSaveText) expSaveText.textContent = "更新する";
          if(expSaveIcon) expSaveIcon.setAttribute('data-lucide', 'refresh-cw');
          renderExpCategories();
          lucide.createIcons();
        }
      } else {
        if(workDateEl) workDateEl.value = idOrDate;
        updateWorkForm();
      }
    };

    // 履歴アイテムの削除
    window.deleteHistItem = (idOrDate) => {
      showConfirm("この記録を削除しますか？", () => {
        if(state.histType === 'expense') {
          state.expenses = state.expenses.filter(e => e.id != idOrDate);
          saveData('expenses', state.expenses);
          renderExpense(); 
        } else {
          state.works = state.works.filter(w => w.date !== idOrDate);
          saveData('works', state.works);
          renderWork(); 
        }
        renderHistoryList();
      });
    };

    const renderHistoryList = () => {
      const titleEl = document.getElementById('hist-month-title');
      if(titleEl) titleEl.textContent = `${state.histMonth.year}年 ${state.histMonth.month}月`;
      const mStr = `${state.histMonth.year}-${String(state.histMonth.month).padStart(2, '0')}`;
      const listEl = document.getElementById('history-list');
      if(!listEl) return;
      
      if(state.histType === 'expense') {
        const data = state.expenses.filter(e => e.date.startsWith(mStr)).reverse();
        if(data.length === 0) { listEl.innerHTML = '<div class="text-center text-gray-400 mt-4 text-sm">記録がありません</div>'; return; }
        
        listEl.innerHTML = data.map(e => `
          <div class="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
            <div>
              <span class="text-[10px] text-gray-400 block">${e.date}</span>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded text-white" style="background-color: ${CATEGORY_COLORS[e.category]||'#ccc'}">${e.category}</span>
                <span class="font-bold text-gray-800">¥${e.amount.toLocaleString()}</span>
              </div>
            </div>
            <div class="flex gap-1">
              <button onclick="editHistItem(${e.id})" class="p-2 text-blue-400 hover:bg-blue-50 rounded-lg"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
              <button onclick="deleteHistItem(${e.id})" class="p-2 text-red-400 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
        `).join('');
      } else {
        const data = state.works.filter(w => w.date.startsWith(mStr)).reverse();
        if(data.length === 0) { listEl.innerHTML = '<div class="text-center text-gray-400 mt-4 text-sm">記録がありません</div>'; return; }
        
        listEl.innerHTML = data.map(w => `
          <div class="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
            <div>
              <span class="text-[10px] text-gray-400 block">${w.date}</span>
              <span class="font-bold text-gray-800">${w.minutes} 分</span>
            </div>
            <div class="flex gap-1">
              <button onclick="editHistItem('${w.date}')" class="p-2 text-blue-400 hover:bg-blue-50 rounded-lg"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
              <button onclick="deleteHistItem('${w.date}')" class="p-2 text-red-400 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    };

    // --- アプリケーション初期化 ---
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => switchTab(e.currentTarget.dataset.tab))
    });
    switchTab('diet');

  </script>
</body>
</html>
